<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepAgent</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#151719;color:#e7e9ea}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:240px 1fr 360px;overflow:hidden}aside,main,section{border-right:1px solid #303337;min-width:0}aside{background:#1b1d20;padding:14px}button,input,textarea{background:#25282c;color:inherit;border:1px solid #41454b;border-radius:6px;padding:8px}button{cursor:pointer}#new{width:100%;margin-bottom:14px}.thread{padding:9px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread.active,.thread:hover{background:#2b3036}main{display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid #303337;font-weight:600}.messages{flex:1;overflow:auto;padding:20px}.msg{max-width:80%;padding:10px 12px;margin:8px 0;border-radius:10px;background:#25282c;white-space:pre-wrap}.msg.user{margin-left:auto;background:#245b9b}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid #303337}.composer textarea{flex:1;resize:none;height:44px}section{padding:14px;background:#1b1d20}pre{height:calc(100vh - 60px);overflow:auto;background:#111;padding:12px;border-radius:6px;color:#c9d1d9}
</style></head><body><aside><button id="new">＋ 新对话</button><div id="threads"></div></aside><main><header id="title">DeepAgent</header><div class="messages" id="messages"></div><form class="composer"><textarea id="input" placeholder="输入消息…"></textarea><button>发送</button></form></main><section><strong>文件</strong><pre id="file">选择工具事件中的文件查看</pre></section>
<script>
let session=localStorage.session||crypto.randomUUID(), thread=null; localStorage.session=session;
const $=id=>document.getElementById(id); const api=(u,o)=>fetch(u,{headers:{'content-type':'application/json'},...o}).then(r=>r.json());
async function list(){let rows=await api('/api/threads?session_id='+encodeURIComponent(session));$('threads').innerHTML='';rows.forEach(t=>{let e=document.createElement('div');e.className='thread '+(t.id===thread?'active':'');e.textContent=t.name||t.id;e.onclick=()=>select(t.id);$('threads').append(e)})}
async function select(id){thread=id;let t=await api('/api/threads/'+id);$('title').textContent=t.name||'DeepAgent';await list();}
async function submit(text){if(!thread){let t=await api('/api/threads',{method:'POST',body:JSON.stringify({session_id:session})});thread=t.id;await list()}let m=await api('/api/threads/'+thread+'/messages',{method:'POST',body:JSON.stringify({text})});let e=document.createElement('div');e.className='msg user';e.textContent=text;$('messages').append(e);$('input').value='';$('messages').scrollTop=1e9;return m}
document.querySelector('.composer').onsubmit=e=>{e.preventDefault();let v=$('input').value.trim();if(v)submit(v)};$('new').onclick=()=>{thread=null;$('messages').innerHTML='';$('title').textContent='新对话';list()};list();
</script></body></html>
