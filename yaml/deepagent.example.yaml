# CLI reads only manager. Worker owns every model/tool setting below.
manager:
  namespace: default
  mysql_dsn: "${DEEPAGENT_MYSQL_DSN}"
  redis_addr: "127.0.0.1:6379"
  redis_password: "${DEEPAGENT_REDIS_PASSWORD}"
  redis_db: 0

worker:
  concurrency: 4
  lease_ms: 60000
  scan_interval: 1s
  message_poll_interval: 500ms
  idle_timeout: 5s
  shutdown_drain_timeout: 30s

filesystem_kind: local # local or docker
# For Docker, set filesystem_kind: docker and provide an image with the aio file API.
# docker:
#   image: "enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest"
#   container_prefix: "deepagent-workspace"

default_model: primary
models:
  - name: primary
    provider: openai
    model: "${DEEPAGENT_MODEL}"
    base_url: "${DEEPAGENT_MODEL_BASE_URL}"
    api_key: "${DEEPAGENT_MODEL_API_KEY}"
    timeout_seconds: 120
max_steps: 100
max_model_calls: 30
context_window: 128000
history_table: deepagent_history
compact_threshold_tokens: 24000
keep_recent_messages: 6
system_prompt: |
  You are a coding assistant. Inspect the workspace before editing.
  Use tools to carry out the user's request. Ask for clarification when required.
skill_paths:
  - deepagent/skills
memory_enabled: false
memory_dir: .eino-cli/shared-memory
memory_lease_ttl: 30s
# memory_user_id: stable-user-id  # defaults to the numeric UserID, then SessionID
mcp: []
# Example MCP server:
# mcp:
#   - name: reference
#     url: https://example.com/mcp
#     headers:
#       Authorization: "Bearer ${REFERENCE_MCP_TOKEN}"
web:
  enabled: false
  # search_url: https://your-search-service/search?q={query}
