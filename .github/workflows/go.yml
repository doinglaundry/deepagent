# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: 'go.mod'

    # chromedp otherwise prefers Ubuntu's snap Chromium over Google Chrome.
    - name: Select Google Chrome
      run: |
        mkdir -p "$RUNNER_TEMP/browser-bin"
        ln -s "$(command -v google-chrome)" "$RUNNER_TEMP/browser-bin/headless_shell"
        echo "$RUNNER_TEMP/browser-bin" >> "$GITHUB_PATH"
        google-chrome --version

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
