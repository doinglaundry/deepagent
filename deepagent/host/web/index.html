<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepAgent</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#151719;color:#e7e9ea}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:240px 1fr 360px;overflow:hidden}aside,main,section{border-right:1px solid #303337;min-width:0}aside{background:#1b1d20;padding:14px}button,input,textarea{background:#25282c;color:inherit;border:1px solid #41454b;border-radius:6px;padding:8px}button{cursor:pointer}#new{width:100%;margin-bottom:14px}.thread{padding:9px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread.active,.thread:hover{background:#2b3036}main{display:flex;flex-direction:column}header{padding:14px 18px;border-bottom:1px solid #303337;font-weight:600}.messages{flex:1;overflow:auto;padding:20px}.msg{max-width:80%;padding:10px 12px;margin:8px 0;border-radius:10px;background:#25282c;white-space:pre-wrap}.msg.user{margin-left:auto;background:#245b9b}.prompt{max-width:90%;padding:12px;margin:10px 0;border:1px solid #655f39;border-radius:10px;background:#292714}.prompt label{display:block;margin:8px 0}.prompt button{margin:8px 6px 0 0}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid #303337}.composer textarea{flex:1;resize:none;height:44px}section{padding:14px;background:#1b1d20}pre{height:calc(100vh - 60px);overflow:auto;background:#111;padding:12px;border-radius:6px;color:#c9d1d9}
</style></head><body><aside><button id="new">＋ 新对话</button><div id="threads"></div></aside><main><header id="title">DeepAgent</header><div class="messages" id="messages"></div><form class="composer"><textarea id="input" placeholder="输入消息…"></textarea><button>发送</button></form></main><section><strong>文件</strong><div style="display:flex;gap:6px;margin:10px 0"><input id="filePath" placeholder="相对路径" style="min-width:0;flex:1"><button id="openFile">打开</button></div><pre id="file">输入相对路径查看文件</pre></section>
<script>
let session=localStorage.session||crypto.randomUUID(), thread=null, cursor=0; localStorage.session=session;
const $=id=>document.getElementById(id); const api=(u,o)=>fetch(u,{headers:{'content-type':'application/json'},...o}).then(r=>r.json());
async function list(){let rows=await api('/api/threads?session_id='+encodeURIComponent(session));$('threads').innerHTML='';rows.forEach(t=>{let e=document.createElement('div');e.className='thread '+(t.id===thread?'active':'');e.textContent=t.title||t.id;e.onclick=()=>select(t.id);$('threads').append(e)})}
async function select(id){thread=id;cursor=0;$('messages').innerHTML='';let t=await api('/api/threads/'+id);$('title').textContent=t.title||'DeepAgent';await list();poll()}
async function submit(text){if(!thread){let t=await api('/api/threads',{method:'POST',body:JSON.stringify({session_id:session})});thread=t.id;await list();poll()}let m=await api('/api/threads/'+thread+'/messages',{method:'POST',body:JSON.stringify({text})});let e=document.createElement('div');e.className='msg user';e.textContent=text;$('messages').append(e);$('input').value='';$('messages').scrollTop=1e9;return m}
async function resume(run,payload){await api('/api/threads/'+thread+'/messages',{method:'POST',body:JSON.stringify({resume:{run_id:run,checkpoint_id:payload.checkpoint_id,interrupt_id:payload.interrupt_id,...payload.response}})});document.querySelectorAll('.prompt button,.prompt input').forEach(e=>e.disabled=true)}
function required(ev,p){let box=document.createElement('div');box.className='prompt';let title=document.createElement('strong');title.textContent=p.kind==='approval'?'需要批准':p.kind==='plan_input'?'需要回答':'需要补充信息';box.append(title);
if(p.kind==='approval'){let detail=document.createElement('div');detail.textContent=(p.tool_name||'工具')+(p.arguments_json?' '+p.arguments_json:'');box.append(detail);[['允许',true],['拒绝',false]].forEach(([label,approved])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>resume(ev.run_id,{...p,response:{approval:{approved,reason:approved?'':'user denied'}}});box.append(b)})}
else if(p.kind==='plan_input'){let answers={};(p.questions||[]).forEach(q=>{let label=document.createElement('label');label.textContent=q.question;let input=document.createElement('input');input.placeholder=(q.options||[]).map(o=>o.label).join(' / ');input.oninput=()=>answers[q.id]={answers:[input.value]};label.append(input);box.append(label)});let b=document.createElement('button');b.textContent='提交';b.onclick=()=>resume(ev.run_id,{...p,response:{request_user_input:{answers}}});box.append(b)}
else{let input=document.createElement('input');input.placeholder='输入回复';box.append(input);let b=document.createElement('button');b.textContent='继续';b.onclick=()=>resume(ev.run_id,{...p,response:{interrupt:{kind:p.kind,info_type:p.info_type,data:{user_answer:input.value}}}});box.append(b)}return box}
async function poll(){if(!thread)return;let rows=await api('/api/threads/'+thread+'/events?after='+cursor);rows.forEach(ev=>{cursor=Math.max(cursor,ev.sequence);if(ev.kind==='input')return;let p=ev.payload||{};if(p.interrupt_id&&p.checkpoint_id){$('messages').append(required(ev,p));return}let e=document.createElement('div');e.className='msg';e.textContent=ev.text||ev.kind;$('messages').append(e)});$('messages').scrollTop=1e9;setTimeout(poll,500)}
document.querySelector('.composer').onsubmit=e=>{e.preventDefault();let v=$('input').value.trim();if(v)submit(v)};$('new').onclick=()=>{thread=null;$('messages').innerHTML='';$('title').textContent='新对话';list()};list();
$('openFile').onclick=async()=>{if(!thread)return;let p=$('filePath').value.trim();if(!p)return;let r=await api('/api/threads/'+thread+'/file?path='+encodeURIComponent(p));$('file').textContent=r.content||r.error||''};
</script></body></html>
